name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (typecheck, lint, test)
    runs-on: ubuntu-latest

    # Service containers are available for integration steps. The default test
    # run only executes unit tests (integration tests are describe.skip-ped), but
    # provisioning these means integration coverage can be enabled without CI
    # changes. See backend/tests/integration/README.md.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stripeforge
          POSTGRES_PASSWORD: stripeforge
          POSTGRES_DB: stripeforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stripeforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://stripeforge:stripeforge@localhost:5432/stripeforge_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci_access_secret_change_me
      JWT_REFRESH_SECRET: ci_refresh_secret_change_me
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Prisma generate
        working-directory: backend
        run: npm run prisma:generate

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Unit tests
        working-directory: backend
        run: npx vitest run tests/unit

      # Integration tests are skipped by default; the services above make it
      # possible to enable them in a follow-up step, e.g.:
      #   - run: npm run prisma:deploy && RUN_INTEGRATION=1 npx vitest run tests/integration

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
