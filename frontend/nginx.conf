server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the fly; skips tiny payloads where it is not worth it.
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy API calls to the backend. The bundle is built with a '/api/v1'
    # fallback (Vite env is compile-time, so a runtime env var does nothing);
    # without this proxy those calls hit nginx and get the SPA shell instead of
    # the API. Must come BEFORE the SPA fallback location.
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long cache for hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The app shell must never be cached, or clients pin a stale index that
    # references deleted hashed bundles after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown routes resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
