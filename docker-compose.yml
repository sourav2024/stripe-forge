# Local development stack for StripeForge.
# Brings up Postgres, Redis, the API, the background worker, and the frontend.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stripeforge
      POSTGRES_PASSWORD: stripeforge
      POSTGRES_DB: stripeforge
    ports:
      # Host port 5433 avoids clashing with a Postgres already running on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stripeforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # `exec` replaces the shell so node becomes PID 1 and receives SIGTERM
    # directly — without it the shell swallows the signal and graceful shutdown
    # never runs.
    command: sh -c "npx prisma migrate deploy && exec node dist/server.js"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://stripeforge:stripeforge@postgres:5432/stripeforge?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Secrets come from the root .env (see .env.example). The env schema
      # refuses to boot in production with placeholder ("change_me") values.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: node dist/workers/index.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://stripeforge:stripeforge@postgres:5432/stripeforge?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # The worker never signs tokens, but the shared env schema validates the
      # full config at boot (fail-fast), so these must be present here too.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # No VITE_API_BASE_URL: Vite env is compile-time, so a runtime env is inert.
    # The bundle's '/api/v1' fallback plus the nginx /api proxy handle routing.
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
